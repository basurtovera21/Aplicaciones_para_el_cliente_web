<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor-formulario">
        <h1>Registro de cliente</h1>
        <form id="formulario-cliente" novalidate> <!-- Deshabilitar la validación del navegador -->
            <div class="formulario-grupo">
                <label for="numero-cedula">Número de cédula (10 dígitos):</label>
                <input type="text" id="numero-cedula" maxlength="10">
                <span class="mensaje-error" id="error-cedula"></span>
            </div>

            <div class="formulario-grupo">
                <label for="nombre-completo">Nombre completo (máximo 30 caracteres):</label>
                <input type="text" id="nombre-completo" maxlength="30">
                <span class="mensaje-error" id="error-nombre"></span>
            </div>

            <div class="formulario-grupo">
                <label for="direccion">Dirección (máximo 50 caracteres):</label>
                <input type="text" id="direccion" maxlength="50">
                <span class="mensaje-error" id="error-direccion"></span>
            </div>

            <div class="formulario-grupo">
                <label for="numero-celular">Número de celular (10 dígitos):</label>
                <input type="text" id="numero-celular" maxlength="10">
                <span class="mensaje-error" id="error-celular"></span>
            </div>

            <div class="formulario-grupo">
                <label for="correo-electronico">Correo electrónico:</label>
                <input type="email" id="correo-electronico">
                <span class="mensaje-error" id="error-correo"></span>
            </div>

            <button type="submit" id="boton-registrar">Registrar</button>
            <p class="mensaje-exito" id="formulario-exito"></p>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
