<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <form id="registroForm" novalidate>
      <h2>Registro de usuario</h2>

      <div class="input-group">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
        <span class="error" id="errorNombre"></span>
      </div>

      <div class="input-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" placeholder="usuario@correo.com">
        <span class="error" id="errorEmail"></span>
      </div>

      <div class="input-group">
        <label for="password">Contraseña (mín. 8 caracteres, una mayúscula y un número):</label>
        <input type="password" id="password">
        <span class="error" id="errorPass"></span>
      </div>

      <button type="submit">Enviar registro</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
